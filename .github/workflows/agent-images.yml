name: agent images

# Builds the compute-pool images and, on a manual run, publishes them by digest and signs the release channel
# (vault 26 §5-7, docker/agent/channel/README.md):
#   entrius/gt-agent          the miner's sshd-only agent; trusts the CA public key baked in (GT_CA_PUB variable)
#   entrius/gt-agent-runner   the self-updater; trusts the release public key baked in (GT_RELEASE_PUB variable)
#   entrius/gt-proof          the empty base image the sealed GPU proof runs in (no binary, no secret)
# A push touching these paths only builds (dry run). Publishing is workflow_dispatch only: nothing reaches Docker
# Hub or the channel by accident. The signed channel is committed to the branch the run was started from; the
# runners follow the copy on `main` (gittensor/agent/config.py AGENT_CHANNEL_URL), so it goes live on merge.
# Keys: vault 27 (the ceremony). GT_RELEASE_KEY is the release private key (repo secret); the public halves are
# repo variables. The controller's CA private key is never here.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version for the channel and the image tags (e.g. 5.1.0)."
        required: true
      commit_channel:
        description: "Commit the signed stable.json + .sig to this branch after publishing."
        type: boolean
        default: true
  push:
    paths:
      - docker/agent/**
      - docker/proof/**
      - .github/workflows/agent-images.yml

permissions:
  contents: write

jobs:
  images:
    name: ${{ github.event_name == 'workflow_dispatch' && 'build, push, sign the channel' || 'build only (dry run)' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Require the trust anchors
        run: |
          test -n "${{ vars.GT_CA_PUB }}" || { echo "GT_CA_PUB repo variable is not set (vault 27)"; exit 1; }
          test -n "${{ vars.GT_RELEASE_PUB }}" || { echo "GT_RELEASE_PUB repo variable is not set (vault 27)"; exit 1; }
          case "${{ vars.GT_CA_PUB }}" in *DO-NOT-SHIP*) echo "GT_CA_PUB is a dev key"; exit 1;; esac
          case "${{ vars.GT_RELEASE_PUB }}" in *DO-NOT-SHIP*) echo "GT_RELEASE_PUB is a dev key"; exit 1;; esac

      - name: Resolve tags
        id: tag
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            V="${{ inputs.version }}"
          else
            V="dev-${GITHUB_SHA::8}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build gt-agent
        id: agent
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/agent/Dockerfile
          push: ${{ github.event_name == 'workflow_dispatch' }}
          build-args: |
            GT_CA_PUB=${{ vars.GT_CA_PUB }}
            GT_AGENT_VERSION=${{ steps.tag.outputs.version }}
          tags: entrius/gt-agent:${{ steps.tag.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build gt-agent-runner
        id: runner
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/agent/runner.Dockerfile
          push: ${{ github.event_name == 'workflow_dispatch' }}
          build-args: |
            GT_RELEASE_PUB=${{ vars.GT_RELEASE_PUB }}
          tags: entrius/gt-agent-runner:${{ steps.tag.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build gt-proof (base image, no binary)
        id: proof
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/proof/Dockerfile
          push: ${{ github.event_name == 'workflow_dispatch' }}
          build-args: |
            GT_PROOF_VERSION=${{ steps.tag.outputs.version }}
          tags: entrius/gt-proof:${{ steps.tag.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign the release channel
        if: github.event_name == 'workflow_dispatch'
        env:
          GT_RELEASE_KEY: ${{ secrets.GT_RELEASE_KEY }}
        run: |
          test -n "$GT_RELEASE_KEY" || { echo "GT_RELEASE_KEY repo secret is not set (vault 27)"; exit 1; }
          umask 077
          KEY="$(mktemp)"
          printf '%s\n' "$GT_RELEASE_KEY" > "$KEY"
          docker/agent/channel/sign.sh --key "$KEY" \
            --agent "${{ steps.agent.outputs.digest }}" \
            --runner "${{ steps.runner.outputs.digest }}" \
            --version "${{ steps.tag.outputs.version }}"
          shred -u "$KEY"
          # verify with the public key the runner image was built with, exactly as the runner will
          printf 'gittensor-release namespaces="gt-agent-channel" %s\n' "$(printf '%s' '${{ vars.GT_RELEASE_PUB }}' | awk '{print $1, $2}')" > allowed_signers
          ssh-keygen -Y verify -f allowed_signers -I gittensor-release -n gt-agent-channel \
            -s docker/agent/channel/stable.json.sig < docker/agent/channel/stable.json
          rm -f allowed_signers
          echo "== channel =="; cat docker/agent/channel/stable.json
          echo "gt-proof: entrius/gt-proof@${{ steps.proof.outputs.digest }}  (pin in gittensor/controller/checks/config.py PROOF_IMAGE_DIGEST)"

      - name: Upload the signed channel
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: agent-channel-${{ steps.tag.outputs.version }}
          path: |
            docker/agent/channel/stable.json
            docker/agent/channel/stable.json.sig

      - name: Commit the signed channel to this branch
        if: github.event_name == 'workflow_dispatch' && inputs.commit_channel
        run: |
          git config user.name "gittensor-release"
          git config user.email "release@gittensor.io"
          git add docker/agent/channel/stable.json docker/agent/channel/stable.json.sig
          git commit -m "agent: release channel ${{ steps.tag.outputs.version }} (gt-agent@${{ steps.agent.outputs.digest }})"
          git push origin HEAD:${{ github.ref_name }}
