name: Build and Push Docker Image

# Publishes the neuron image (root Dockerfile): main -> entrius/gittensor:latest, test -> the :test tag.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - test

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Resolve the tag from the branch
        id: tag
        run: |
          REF="${{ github.ref_name }}"
          echo "tag=$([ "$REF" = main ] && echo latest || echo "$REF")" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push the neuron image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: entrius/gittensor:${{ steps.tag.outputs.tag }},entrius/gittensor:${{ github.sha }}
