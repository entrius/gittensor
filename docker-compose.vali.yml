services:
  validator:
    image: entrius/gittensor:latest
    container_name: gt-vali
    restart: unless-stopped
    mem_limit: "3g"
    entrypoint: /app/scripts/vali-entrypoint.sh
    env_file:
      - .env
    ports:
      # Set AXON_PUBLISH=127.0.0.1:<port> to bind loopback-only behind a reverse proxy (unset = raw internet publish).
      - "${AXON_PUBLISH:-0.0.0.0:${PORT}}:${PORT}"
      # Serving inference API (opt-in, see .env.example): loopback on the host by default; front it with your reverse proxy.
      - "${SERVING_API_PUBLISH:-127.0.0.1:${SERVING_API_PORT:-8790}}:${SERVING_API_PORT:-8790}"
    volumes:
      # 'ro' = readonly
      - ${WALLET_PATH}:/root/.bittensor/wallets:ro
      - ./data:/app/data
    # optional: uncomment this if you are running validator database
    # networks:
    #   - gittensor_network
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Optional reference runtime for the serving audit loop (profile "reference"). Runs the same blessed
  # sparkinfer_server miners run, on the validator's own GPU, so audits compare against a live honest copy
  # instead of a bank snapshot. sparkinfer publishes no container image yet (asked upstream), so this builds
  # from a local checkout: SPARKINFER_SRC=/path/to/sparkinfer (must contain a Dockerfile building
  # sparkinfer_server with -DBUILD_SERVER=ON; see docs/serving-runtime-contract.md §6).
  #   docker compose -f docker-compose.vali.yml --profile reference up -d
  # then set SERVING_REFERENCE_URL=http://reference:8080 in .env.
  reference:
    build:
      context: ${SPARKINFER_SRC:-../sparkinfer}
    container_name: gt-vali-reference
    restart: unless-stopped
    profiles: ["reference"]
    command: ["./server/run.sh", "--download", "--port", "8080"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./data/models:/models

  watchtower:
    image: nickfedor/watchtower
    container_name: gittensor-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_POLL_INTERVAL: 200
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"

# uncomment this if you are running validator database
# networks:
#   gittensor_network:
#     external: true
