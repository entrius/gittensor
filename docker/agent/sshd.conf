# gt-agent sshd policy (drop-in read by sshd_config's `Include /etc/ssh/sshd_config.d/*.conf`).
# The port and host key are runtime flags in entrypoint.sh (they come from the container's env / volume).
#
# Root, by certificate only (vault 26 §5). The ONLY way in is a certificate signed by the CA key baked into the
# image at build; there is no authorized_keys file to add to and no route that installs keys.
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PubkeyAuthentication yes
TrustedUserCAKeys /etc/ssh/gt_ca.pub
AuthorizedKeysFile none
# Certificates carry their principal list; sshd requires the login name (root) to be in it. No principals file:
# a certificate for any other principal is refused.
AuthorizedPrincipalsFile none
# Ephemeral per-visit keys: no persistent forwarding surface beyond what the controller's docker-over-ssh needs.
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding yes
# Dead controller sessions go away (a heartbeat is ~60 s; WS-D).
ClientAliveInterval 30
ClientAliveCountMax 3
# Every accepted certificate's key ID and serial land in the log: which visit did what, for the command log.
LogLevel VERBOSE
# OpenSSH >= 9.8 penalises a source address whose connections keep failing auth. Behind a NAT / userland proxy
# every connection looks like one source, so scanner noise locks the controller out (Lium DAH-3236; vault 22).
PerSourcePenalties no
