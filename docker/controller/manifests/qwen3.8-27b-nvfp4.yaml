# The Qwen3.8-27B (NVFP4) chat workload as blessed for the compute pool: the phase-0 sparkinfer image, unchanged.
# Spec: entrius/gittensor-compute-template MANIFEST.md. Bless: `gitt controller bless <this> --image <repo@sha256>`.
#
# The image is not template-shaped: its entrypoint (docker/sparkinfer-entrypoint.sh) downloads the model itself unless
# `<MODELS_DIR>/<repo basename>/.revision` matches, and its run.sh re-downloads the tokenizer unless
# `<MODELS_DIR>/.tokenizer_repo` matches TOK_REPO. The workload has no egress and a read-only volume, so every file
# either script checks is a pre-staged, sha256-verified artifact:
#   * the model directory at the pinned revision; the controller's fetch writes its `.revision` marker, which the
#     directory hash skips (top-level dotfiles are markers, not content);
#   * tokenizer.json from that same revision, because the entrypoint copies it to MODELS_DIR when absent (a write);
#   * `.tokenizer_repo` as a `data:` artifact, because run.sh downloads a tokenizer when it is absent (egress).
# The volume stays read-only: `read_only: false` would still fail on the tokenizer marker, and it would let the
# workload rewrite the weights it is verified against.
name: qwen3.8-27b-nvfp4
version: 5
description: Qwen3.8-27B (NVFP4) chat on sparkinfer 19ef39ec2, one RTX 5090 per instance
runtime: sparkinfer
image: entrius/sparkinfer:v0.5.7@sha256:9968020928cfbed73796fbbbc86a330d4260cfa78b1f48908cde82c6f3a13f32
placement:
  gpu_types: {include: [RTX5090]}
  cards_per_instance: 1
  min_vram_gb: 30            # 25 GiB resident at CTX 131072 (9/8)
  max_load_s: 60             # 9/15 measured 16.5 s with weights in page cache on a fast disk; 60 until a cold-cache load on a slower box is measured (Kimbo 9/15)
                             # cache because the pre-start hash had just read them; a start that skips that hash reads cold
run:
  env:
    MODELS_DIR: /models
    SPARKINFER_DETERMINISTIC: '0'   # v5: no output audits any more; determinism off (TTFT +2-8% when on)
    MODEL_DIR_REPO: gittensor-model-hub/Qwen3.8-27B-NVFP4-RTX5090
    MODEL_DIR_REVISION: 8e2c0cd25468ac5c1f85f621c2b8edb15ea1f03a
    MODEL_DIR_SHA256: model-00001-of-00002.safetensors=cdd37b0e61eccc8a3d7d08f9d1a4f52856a9d88e4e8b42089bd18a970e3a01ec,model-00002-of-00002.safetensors=713b84b8287e2193290214766c5384fa6475c5626a628e4021c2c9ca90aa61df
    TOK_REPO: gittensor-model-hub/Qwen3.8-27B-NVFP4-RTX5090
    MODEL_NAME: qwen3.8-27b
    CTX: '131072'
  volumes: [{name: models, mount: /models, read_only: true}]
network:
  egress: []                 # none: the controller pre-stages every file the entrypoint and run.sh look for
artifacts:
  - path: /models/Qwen3.8-27B-NVFP4-RTX5090
    source: hf://gittensor-model-hub/Qwen3.8-27B-NVFP4-RTX5090
    revision: 8e2c0cd25468ac5c1f85f621c2b8edb15ea1f03a
    sha256: d4382c5ebc8c9ece150aafc831910e01b6fb022ac9a72d36c3acc9715456e632
  - path: /models/tokenizer.json
    source: https://huggingface.co/gittensor-model-hub/Qwen3.8-27B-NVFP4-RTX5090/resolve/8e2c0cd25468ac5c1f85f621c2b8edb15ea1f03a/tokenizer.json
    revision: 8e2c0cd25468ac5c1f85f621c2b8edb15ea1f03a
    sha256: 0997f410c57a1f4e53b09e4be8f4a172d90edd9564368fb0847030937229b9f3
  - path: /models/.tokenizer_repo
    source: data:,gittensor-model-hub/Qwen3.8-27B-NVFP4-RTX5090
    revision: inline
    sha256: bcd0e1c18dd8fe8def2cbb7d8d80e29b7b2d7869f2b89f7f158685951fd479d9
health:
  http: {path: /v1/models, port: 8080, expect_status: 200}
  interval_s: 60
  failure_threshold: 3
entry_canary:                # one picked at random each start; sent at front_door.concurrency (warmup)
  # Every canary is a tool call: one call proves the weights decode AND that `tools` reach the chat template. Thinking
  # is off (the release's `enable_thinking: false`): Qwen3.8 thinks by default and would spend max_tokens before calling.
  - type: http
    http: {method: POST, path: /v1/chat/completions, port: 8080}
    body:
      messages: [{role: user, content: "What is 17 × 23? Use the multiply tool."}]
      max_tokens: 64
      enable_thinking: false
      tools:
        - type: function
          function:
            name: multiply
            parameters: {type: object, properties: {a: {type: number}, b: {type: number}}, required: [a, b]}
    # Order-free lookaheads: sparkinfer serialises "arguments" before "name", so 'multiply[\s\S]*17' never matches.
    pass: {status: 200, regex: '(?=[\s\S]*"finish_reason":\s*"tool_calls")(?=[\s\S]*"name":\s*"multiply")(?=[\s\S]*\\"[ab]\\":\s*17\b)(?=[\s\S]*\\"[ab]\\":\s*23\b)'}
  - type: http
    http: {method: POST, path: /v1/chat/completions, port: 8080}
    body:
      messages: [{role: user, content: "What's the weather in Paris right now? Use the tool."}]
      max_tokens: 64
      enable_thinking: false
      tools:
        - type: function
          function:
            name: get_weather
            parameters: {type: object, properties: {city: {type: string}}, required: [city]}
    pass: {status: 200, regex: '(?=[\s\S]*"finish_reason":\s*"tool_calls")(?=[\s\S]*"name":\s*"get_weather")(?=[\s\S]*\\"city\\":\s*\\"Paris)'}
profile:                     # health and standing only, never pay
  decode_tps_single: 93      # 9/15 client side, 256 tokens after 30 / 8k / 18k / 32k-token prompts: 92.6–97.9 tok/s
  decode_tps_aggregate: 338  # 9/8, 16 concurrent short prompts; 9/15: 275 at 4 short, 67 at 4 × 8k (served in turn)
  prefill_tps: [6700, 7500]  # 9/15 server ttft_ms: 7.5k tok/s at 8k, 7.0k at 18k, 6.75k at 32k tokens
  vram_gb: 25
front_door:
  type: gateway-openai
  port: 8080
  concurrency: 1             # 9/15: 4 concurrent 8k-token prompts are served one at a time (server TTFT 1.1 / 4.4 / 8.3 /
                             # 12.2 s; the same with SPARKINFER_DETERMINISTIC=0), so a second slot only queues inside the
                             # runtime, which never 429s (max_queue_depth unlimited). Short prompts do batch (275 tok/s at 4).
  routes:
    - {path: /v1/chat/completions, method: POST, stream: true}
    - {path: /v1/models, method: GET}
drain:
  type: requests
  max_s: 30                  # what sparkinfer 19ef39ec2 actually delivers: it force-exits 30 s after SIGTERM whatever is in flight (Kimbo 9/15; upstream asks filed)
                             # SIGTERM, and an idle instance takes all 30 s (it reports requests still draining)
