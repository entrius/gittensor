# Use this document to specify the minimum compute requirements.
# This document will be used to generate a list of recommended hardware for your subnet.

# This is intended to give a rough estimate of the minimum requirements
# so that the user can make an informed decision about whether or not
# they want to run a miner or validator on their machine.

version: "1.0"

compute_spec:
  miner:
    cpu: 2 # Minimum number of CPU cores
    ram: 4 # Minimum RAM (GB)

  validator:
    cpu: 2 # Minimum number of CPU cores
    ram: 8 # Minimum RAM (GB)
    # Serving sub-mechanism (SERVING_ENABLED=true) is opt-in and needs NO local GPU: the validator audits
    # against a live reference copy of each blessed release reachable over HTTP — its own RTX 5090, or a
    # rented one (e.g. Lium, ~$0.65/h) running the same image behind an API key. Fallback with neither:
    # bank snapshots (weaker, finite).
    serving_reference: "reachable RTX 5090 running the blessed image (local or rented), optional"

  serving_miner:
    cpu: 4
    ram: 32 # Minimum RAM (GB)
    gpu: "RTX 5090 (32 GB)" # one blessed release per GPU; see docs/serving-runtime-contract.md
